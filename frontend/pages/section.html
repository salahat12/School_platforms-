<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملفات - البيرة الاساسية المختلطه</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header"></header>
        <main class="main-content">
            <div class="container">
                <div class="breadcrumb">
                    <a href="/grades">الصفوف</a>
                    <span class="breadcrumb-separator">›</span>
                    <a href="/grade/${grade}" id="bc-grade">الصف</a>
                    <span class="breadcrumb-separator">›</span>
                    <a href="/grade/${grade}/subject/${encodeURIComponent(subject)}" id="bc-subject">المادة</a>
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-current">شعبة <span id="section-code"></span></span>
                </div>
                <h1 class="page-title">الملفات المتاحة</h1>
                <div id="files-content"></div>
            </div>
        </main>
        <footer class="site-footer">
            <div class="container"><p>البيرة الاساسية المختلطه</p></div>
        </footer>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        const parts = window.location.pathname.split('/');
        const grade = parts[2];
        const subject = decodeURIComponent(parts[4]);
        const section = parts[6];
        
        document.getElementById('bc-grade').href = '/grade/' + grade;
        document.getElementById('bc-grade').textContent = 'الصف ' + grade;
        document.getElementById('bc-subject').href = '/grade/' + grade + '/subject/' + encodeURIComponent(subject);
        document.getElementById('bc-subject').textContent = subject;
        document.getElementById('section-code').textContent = section;
        
        const typeLabels = { lesson: 'دروس', worksheet: 'أوراق عمل', exam: 'امتحانات', activity: 'أنشطة', plan: 'خطط', other: 'أخرى' };
        const typeIcons = { lesson: '📖', worksheet: '📝', exam: '📋', activity: '🎨', plan: '📅', other: '📎' };
        
        async function loadFiles() {
            const container = document.getElementById('files-content');
            try {
                const data = await apiClient.get(`/api/public/grades/${grade}/subjects/${encodeURIComponent(subject)}/sections/${section}/files`);
                
                if (!data.files || data.files.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📂</div>
                            <div class="empty-state-title">لا توجد ملفات متاحة</div>
                            <p>لم يتم نشر أي ملفات عامة لهذه الشعبة بعد.</p>
                        </div>`;
                    return;
                }
                
                let html = '';
                const types = ['lesson', 'worksheet', 'exam', 'activity', 'plan', 'other'];
                types.forEach(type => {
                    const files = data.grouped[type] || [];
                    if (files.length === 0) return;
                    
                    html += `
                        <div class="card mt-2">
                            <h3 style="margin-bottom: 16px; color: var(--primary-dark);">
                                ${typeIcons[type]} ${typeLabels[type]}
                            </h3>
                            <div style="display: flex; flex-direction: column; gap: 10px;">
                    `;
                    files.forEach(f => {
                        html += `
                            <div class="file-card">
                                <div class="file-icon">📄</div>
                                <div class="file-info">
                                    <div class="file-name">${f.file_name}</div>
                                    <div class="file-meta">المعلمة: ${f.teacher_name} • ${new Date(f.uploaded_at).toLocaleDateString('ar-SA')}</div>
                                </div>
                                <a href="/api/files/${f.id}/download" class="btn btn-primary btn-sm">تحميل</a>
                            </div>
                        `;
                    });
                    html += '</div></div>';
                });
                
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
