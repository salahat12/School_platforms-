<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الملفات - البيرة الاساسية المختلطه</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header"></header>
        <main class="main-content">
            <div class="container">
                <div class="breadcrumb">
                    <a href="/admin-dashboard">لوحة التحكم</a>
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-current">الملفات</span>
                </div>
                <h1 class="page-title">إدارة الملفات</h1>
                <div id="alert"></div>
                <div id="files-table"></div>
            </div>
        </main>
        <footer class="site-footer">
            <div class="container"><p>البيرة الاساسية المختلطه</p></div>
        </footer>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function init() {
            const user = await checkAuth();
            if (!user || user.role !== 'admin') { window.location.href = '/login'; return; }
            loadFiles();
        }
        
        async function loadFiles() {
            try {
                const data = await apiClient.get('/api/files');
                const container = document.getElementById('files-table');
                if (data.files.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-title">لا توجد ملفات</div></div>';
                    return;
                }
                const typeLabels = { lesson: 'درس', worksheet: 'ورقة عمل', exam: 'امتحان', activity: 'نشاط', plan: 'خطة', other: 'أخرى' };
                let html = `<table class="data-table"><thead><tr><th>الملف</th><th>المعلمة</th><th>الصف</th><th>المادة</th><th>الشعبة</th><th>النوع</th><th>الرؤية</th><th>إجراءات</th></tr></thead><tbody>`;
                data.files.forEach(f => {
                    const visibility = f.visible_to_public 
                        ? '<span class="badge badge-success">عام</span>' 
                        : '<span class="badge badge-danger">خاص</span>';
                    html += `<tr>
                        <td>${f.file_name}</td>
                        <td>${f.teacher_name || '-'}</td>
                        <td>${f.grade}</td>
                        <td>${f.subject}</td>
                        <td>${f.section}</td>
                        <td>${typeLabels[f.file_type]}</td>
                        <td>${visibility}</td>
                        <td>
                            <button onclick="toggleVisibility(${f.id}, ${!f.visible_to_public})" class="btn btn-sm btn-outline">${f.visible_to_public ? 'إخفاء' : 'نشر'}</button>
                            <button onclick="deleteFile(${f.id})" class="btn btn-sm btn-danger">حذف</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        
        async function toggleVisibility(id, visible) {
            try {
                await apiClient.patch(`/api/files/${id}/visibility`, { visible_to_public: visible });
                loadFiles();
            } catch (err) {
                document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        
        async function deleteFile(id) {
            if (!confirm('هل أنت متأكد؟')) return;
            try {
                await apiClient.delete(`/api/files/${id}`);
                loadFiles();
            } catch (err) {
                document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
