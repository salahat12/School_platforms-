<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية - البيرة الاساسية المختلطه</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header"></header>
        <main class="main-content">
            <div class="container">
                <div class="breadcrumb">
                    <a href="/grades">الصفوف</a>
                    <span class="breadcrumb-separator">›</span>
                    <span class="breadcrumb-current" id="grade-name"></span>
                </div>
                <h1 class="page-title">المواد الدراسية</h1>
                <div id="subjects-list" class="card-grid mt-3"></div>
            </div>
        </main>
        <footer class="site-footer">
            <div class="container"><p>البيرة الاساسية المختلطه</p></div>
        </footer>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        const grade = window.location.pathname.split('/').pop();
        document.getElementById('grade-name').textContent = 'الصف ' + grade;
        
        async function loadSubjects() {
            const container = document.getElementById('subjects-list');
            try {
                        const data = await apiClient.get(`/api/public/grades/${grade}/subjects`);
                        const core = ['العربي','الانجليزي','الرياضيات','علوم'];
                        // map server names to display names if necessary
                        const subjects = data.subjects
                            .map(s => (typeof s === 'string' ? s : s.name))
                            .filter(name => core.includes(name));
                        let html = '';
                        // If server returned none of core subjects, fall back to core list
                        const finalList = subjects.length ? subjects : core;
                        finalList.forEach(name => {
                            html += `
                                <a href="/grade/${grade}/subject/${encodeURIComponent(name)}" class="subject-card">
                                    <div class="subject-icon">📖</div>
                                    <div class="subject-info">
                                        <h3>${name}</h3>
                                        <p>اضغط لاستعراض الشُّعب</p>
                                    </div>
                                </a>
                            `;
                        });
                        container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadSubjects);
    </script>
</body>
</html>
