<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفوف الدراسية - البيرة الاساسية المختلطه</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header"></header>
        <main class="main-content">
            <div class="container">
                <h1 class="page-title">الصفوف الدراسية</h1>
                <p class="page-subtitle">اختر الصف لاستعراض المواد والملفات</p>
                <div id="grades-list" class="card-grid mt-3"></div>
            </div>
        </main>
        <footer class="site-footer">
            <div class="container"><p>البيرة الاساسية المختلطه</p></div>
        </footer>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function loadGrades() {
            const container = document.getElementById('grades-list');
            try {
                const data = await apiClient.get('/api/public/grades');
                let html = '';
                data.grades.forEach(g => {
                    html += `
                        <a href="/grade/${g.id}" class="grade-card">
                            <div class="grade-number">${g.id}</div>
                            <div class="grade-label">${g.name}</div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadGrades);
    </script>
</body>
</html>
