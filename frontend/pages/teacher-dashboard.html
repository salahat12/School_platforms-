<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المعلمة - البيرة الاساسية المختلطه</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header"></header>
        <main class="main-content">
            <div class="container">
                <h1 class="page-title">لوحة تحكم المعلمة</h1>
                <p class="page-subtitle">تكليفاتك الدراسية وملفاتك التعليمية</p>
                <div id="assignments"></div>
            </div>
        </main>
        <footer class="site-footer">
            <div class="container"><p>البيرة الاساسية المختلطه</p></div>
        </footer>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function loadAssignments() {
            const user = await checkAuth();
            if (!user || user.role !== 'teacher') {
                window.location.href = '/login';
                return;
            }
            
            const container = document.getElementById('assignments');
            
            try {
                const data = await apiClient.get('/api/assignments/my');
                const grouped = data.grouped || [];
                
                if (grouped.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-title">لا توجد تكليفات</div>
                            <p>لم يتم تعيينك لأي مادة بعد. تواصل مع الإدارة.</p>
                        </div>`;
                    return;
                }
                
                let html = '<div class="card-grid">';
                grouped.forEach(g => {
                    const sectionsStr = g.sections.join('، ');
                    html += `
                        <div class="assignment-card">
                            <div class="assignment-subject">${g.subject}</div>
                            <div class="assignment-meta">
                                <span>📖 الصف ${g.grade}</span>
                                <span>👥 شعبة: ${sectionsStr}</span>
                            </div>
                            <div class="assignment-actions">
                                <a href="/teacher-files?subject=${encodeURIComponent(g.subject)}&grade=${g.grade}&section=${g.sections[0]}" class="btn btn-primary btn-sm">📁 ملفاتي</a>
                                <a href="/teacher-upload?subject=${encodeURIComponent(g.subject)}&grade=${g.grade}&section=${g.sections[0]}" class="btn btn-secondary btn-sm">⬆️ رفع ملف</a>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="alert alert-error">خطأ في تحميل البيانات: ${err.message}</div>`;
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadAssignments);
    </script>
</body>
</html>
